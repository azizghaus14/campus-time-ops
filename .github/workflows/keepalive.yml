# Render's free plan sleeps after 15 idle minutes. Ping the live demo every 10 minutes so judges never hit a cold start.
name: keep demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping live demo
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://campus-time-ops.onrender.com/api/backend/health || true)
            echo "attempt $i: $code"; [ "$code" = "200" ] && exit 0; sleep 20
          done
          exit 1
